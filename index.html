
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids.IRC - Chatroom</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #c5c5c5;
    font-family: Tahoma, Arial, sans-serif;
    color: #222;
    font-size: 13px;
}

header {
    background: linear-gradient(#3976a9, #16436d);
    color: white;
    padding: 18px;
    border-bottom: 3px solid #0d2942;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header span { color: #a9e5ff; }

.container {
    display: flex;
    gap: 10px;
    padding: 10px;
}

.sidebar {
    width: 210px;
    flex-shrink: 0;
    background: #eee;
    border: 1px solid #999;
    padding: 10px;
}

.sidebar h3 {
    background: #316b9a;
    color: white;
    padding: 8px;
}

.sidebar a {
    display: block;
    padding: 9px;
    color: #174f7d;
    text-decoration: none;
    border-bottom: 1px solid #ddd;
}

.sidebar a:hover {
    background: #d5eaff;
}

.content {
    flex: 1;
    min-width: 0;
    background: white;
    border: 1px solid #999;
    padding: 15px;
    min-height: 500px;
}

.title {
    background: #316b9a;
    color: white;
    padding: 10px;
}

.login {
    max-width: 350px;
    margin: 35px auto;
    padding: 20px;
    background: #eee;
    border: 1px solid #999;
}

input {
    width: 100%;
    padding: 10px;
    margin: 7px 0;
    border: 1px solid #999;
}

button {
    background: #28618f;
    color: white;
    border: 1px solid #17446b;
    padding: 10px 16px;
    cursor: pointer;
}

button:hover { background: #17446b; }

#chatroom { display: none; }

.chat {
    background: white;
    border: 1px solid #888;
    height: 350px;
    padding: 10px;
    overflow-y: auto;
    font-family: monospace;
}

.message { margin: 8px 0; }

.username {
    color: #145b99;
    font-weight: bold;
}

.chatbar {
    display: flex;
    gap: 5px;
}

.chatbar input { flex: 1; }

footer {
    background: #16436d;
    color: white;
    text-align: center;
    padding: 12px;
    margin-top: 15px;
}

@media(max-width: 650px) {
    .container { flex-direction: column; }
    .sidebar { width: 100%; }
}
</style>
</head>

<body>

<header>
    <h1>Kids<span>.IRC</span></h1>
    <p>Your internet hangout!</p>
</header>

<div class="container">

    <aside class="sidebar">
        <h3>Navigation</h3>
        <a href="#" onclick="showLogin()">Home</a>
        <a href="#" onclick="showChat()">Chatroom</a>
        <a href="userdata.html">User Data</a>

        <h3>Channels</h3>
        <a href="#" onclick="changeChannel('general')">#general</a>
        <a href="#" onclick="changeChannel('random')">#random</a>
        <a href="#" onclick="changeChannel('games')">#games</a>

        <h3>Account</h3>
        <p id="accountStatus">Not logged in</p>
        <button onclick="logout()">Log out</button>
    </aside>

    <main class="content">

        <section id="loginScreen">
            <h2 class="title">Welcome to Kids.IRC!</h2>

            <div class="login">
                <h2>Login / Register</h2>

                <input id="username" placeholder="Username" maxlength="20">
                <input id="password" type="password" placeholder="Password">

                <button onclick="register()">Create Account</button>
                <button onclick="login()">Login</button>

                <p id="status"></p>
            </div>
        </section>

        <section id="chatroom">
            <h2 class="title" id="channelTitle">#general</h2>

            <p>Welcome to Kids.IRC, <b id="welcomeName"></b>!</p>

            <div class="chat" id="messages">
                <div class="message">
                    <span class="username">Server:</span>
                    Welcome to Kids.IRC!
                </div>
            </div>

            <div class="chatbar">
                <input id="chatInput" placeholder="Write a message..."
                onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
        </section>

    </main>
</div>

<footer>
    Kids.IRC &copy; 2026 - Have fun chatting!
</footer>

<script>
let currentUser = null;
let channel = "general";

// DEMO ONLY: local browser storage.
// Replace with a secure backend for real accounts.

function register() {
    let name = document.getElementById("username").value.trim();
    let pass = document.getElementById("password").value;

    if (!name || !pass) {
        statusText("Enter a username and password!");
        return;
    }

    let users = JSON.parse(localStorage.getItem("kidsirc_users") || "{}");

    if (users[name.toLowerCase()]) {
        statusText("That username already exists!");
        return;
    }

    // Demo only. Passwords are NOT secure in localStorage.
    users[name.toLowerCase()] = {
        username: name,
        password: pass
    };

    localStorage.setItem("kidsirc_users", JSON.stringify(users));

    statusText("Account created! You can now log in.");
}

function login() {
    let name = document.getElementById("username").value.trim();
    let pass = document.getElementById("password").value;

    let users = JSON.parse(localStorage.getItem("kidsirc_users") || "{}");
    let user = users[name.toLowerCase()];

    if (!user || user.password !== pass) {
        statusText("Incorrect username or password!");
        return;
    }

    currentUser = user.username;
    showChat();
}

function showChat() {
    if (!currentUser) return;

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("chatroom").style.display = "block";
    document.getElementById("welcomeName").textContent = currentUser;
    document.getElementById("accountStatus").textContent = currentUser;
}

function showLogin() {
    document.getElementById("chatroom").style.display = "none";
    document.getElementById("loginScreen").style.display = "block";
}

function logout() {
    currentUser = null;
    document.getElementById("accountStatus").textContent = "Not logged in";
    showLogin();
}

function statusText(text) {
    document.getElementById("status").textContent = text;
}

function changeChannel(name) {
    channel = name;
    document.getElementById("channelTitle").textContent = "#" + name;
    document.getElementById("messages").innerHTML =
        '<div class="message"><b>Server:</b> Welcome to #' + name + '!</div>';
}

function sendMessage() {
    if (!currentUser) return;

    let input = document.getElementById("chatInput");
    let message = input.value.trim();

    if (!message) return;

    let div = document.createElement("div");
    div.className = "message";

    let username = document.createElement("span");
    username.className = "username";
    username.textContent = currentUser + ": ";

    div.appendChild(username);
    div.appendChild(document.createTextNode(message));

    document.getElementById("messages").appendChild(div);
    input.value = "";

    let chat = document.getElementById("messages");
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
